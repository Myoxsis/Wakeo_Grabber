<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wakeo Grabber</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1>Wakeo Grabber</h1>
        <p>Side-panel workflow inspired by Geneanet Explorer.</p>
      </header>

      <section class="popup__stats" aria-live="polite">
        <span id="capture-count" class="stat-pill">0 links</span>
        <span id="selection-count" class="stat-pill">0 selected</span>
        <span id="content-count" class="stat-pill">0 payloads</span>
      </section>

      <section class="popup__actions popup__actions--top">
        <button id="record" class="primary">Start recording</button>
        <button id="capture-now" class="ghost">Capture now</button>
        <button id="auto-process" class="ghost">Auto process queue</button>
      </section>

      <nav class="tabs" aria-label="Panel sections">
        <button class="tab is-active" data-tab="links">Pending links</button>
        <button class="tab" data-tab="content">Captured content</button>
        <button class="tab" data-tab="export">Export</button>
      </nav>

      <section class="tab-panel" data-panel="links">
        <section class="popup__actions">
          <button id="select-all" class="ghost">Select all</button>
          <button id="delete-selected" class="ghost">Delete selected</button>
        </section>

        <section class="popup__history" aria-live="polite">
          <h2>Pending shipment links</h2>
          <ul id="history" class="history"></ul>
        </section>
      </section>

      <section class="tab-panel" data-panel="content" hidden>
        <section class="popup__actions">
          <button id="content-select-all" class="ghost">Select all content</button>
          <button id="content-download-selected" class="ghost">Download selected content</button>
        </section>

        <section class="popup__history" aria-live="polite">
          <h2>Captured shipment content</h2>
          <ul id="content-history" class="history"></ul>
        </section>

        <section id="content-selected-preview" class="selected-content" hidden>
          <div class="selected-content__header">
            <h2>Selected captured shipment content</h2>
            <button id="content-copy-selected" class="ghost" type="button">Copy</button>
          </div>
          <textarea
            id="content-selected-output"
            class="selected-content__output"
            readonly
            aria-label="Selected captured shipment content"
          ></textarea>
        </section>
      </section>

      <section class="tab-panel" data-panel="export" hidden>
        <section class="popup__actions">
          <button id="download-selected" class="ghost">Export selected JSON</button>
          <button id="clear" class="ghost">Clear all</button>
        </section>

        <section id="selected-content" class="selected-content" hidden>
          <div class="selected-content__header">
            <h2>Selected content</h2>
            <button id="copy-selected" class="ghost" type="button">Copy</button>
          </div>
          <textarea
            id="selected-content-output"
            class="selected-content__output"
            readonly
            aria-label="Selected captured content"
          ></textarea>
        </section>
      </section>

      <label class="lock-toggle">
        <input id="lock-right" type="checkbox" />
        <span>Open from extension icon in right side panel</span>
      </label>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
