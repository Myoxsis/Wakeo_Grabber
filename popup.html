<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wakeo Grabber</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1>Wakeo Grabber</h1>
        <p>Capture Wakeo.com links from page + network requests.</p>
      </header>

      <section class="popup__stats" aria-live="polite">
        <span id="capture-count" class="stat-pill">0 links</span>
        <span id="selection-count" class="stat-pill">0 selected</span>
      </section>

      <section class="popup__actions">
        <button id="record" class="primary">Start recording</button>
        <button id="capture-now" class="ghost">Capture now</button>
      </section>

      <section class="popup__actions">
        <button id="select-all" class="ghost">Select all</button>
        <button id="delete-selected" class="ghost">Delete selected</button>
      </section>

      <section class="popup__actions">
        <button id="download-selected" class="ghost">Export selected JSON</button>
        <button id="clear" class="ghost">Clear all</button>
      </section>

      <section id="selected-content" class="selected-content" hidden>
        <div class="selected-content__header">
          <h2>Selected content</h2>
          <button id="copy-selected" class="ghost" type="button">Copy</button>
        </div>
        <textarea
          id="selected-content-output"
          class="selected-content__output"
          readonly
          aria-label="Selected captured content"
        ></textarea>
      </section>

      <label class="lock-toggle">
        <input id="lock-right" type="checkbox" />
        <span>Lock popup on the right side (open side panel)</span>
      </label>

      <section class="popup__history" aria-live="polite">
        <h2>Captured Wakeo links</h2>
        <ul id="history" class="history"></ul>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
